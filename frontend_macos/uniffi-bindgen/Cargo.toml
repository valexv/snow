[package]
name = "uniffi-bindgen"
version = "1.6.0"
edition = "2024"
description = "Generates the Swift bindings of snow_ffi for the macOS frontend"
publish = false

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# Must be the same version as in ../snow_ffi
uniffi = { version = "=0.32.2", features = ["cli"] }
